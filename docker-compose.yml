services:
  beacon:
    build: .
    container_name: beacon
    restart: unless-stopped
    ports:
      - "127.0.0.1:8585:8585"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - SITE_TITLE=Service Status
      - SITE_DESCRIPTION=Vela NAS — self-hosted services
      - POLL_INTERVAL=15
      # Glob patterns supported (fnmatch).
      # Format: pattern:Display Name (or just pattern)
      - >-
        SERVICES=ntfy:Notifications,
        forgejo:Forgejo,
        syncthing:Syncthing,
        filebrowser:File Browser,
        homepage:Homepage,
        immich_server:Immich,
        blog-web-*:Blog,
        kobo-article-pipeline-wallabag-1:Wallabag,
        vikunja:Vikunja,
        walkingpad:WalkingPad,
        deploy-webhook:Deploy Webhook,
        buda-bot:Buda Bot,
        beacon:Beacon,
        lookout:Lookout
