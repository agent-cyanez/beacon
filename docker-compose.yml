services:
  beacon:
    build: .
    container_name: beacon
    restart: unless-stopped
    # SERVICES and ENDPOINTS come from .env (see .env.example).
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:8585:8585"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - beacon-data:/data
    environment:
      - SITE_TITLE=Service Status
      - SITE_DESCRIPTION=Self-hosted services
      - POLL_INTERVAL=15
      - SHOW_RESPONSE_TIME=true
      - REFRESH_INTERVAL=30

volumes:
  beacon-data:
